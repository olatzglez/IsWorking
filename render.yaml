# Blueprint de Render para IsWorking.
# Un único servicio web: Express sirve la API (/api) y el frontend compilado (frontend/dist).
# Las bases de datos van fuera de Render, en planes gratuitos que no caducan,
# ambas en la región de Fráncfort (AWS eu-central-1):
#   - PostgreSQL en Neon        → su cadena de conexión se introduce a mano (DATABASE_URL)
#   - MongoDB en MongoDB Atlas  → su cadena de conexión se introduce a mano (MONGO_URI)

services:
  - type: web
    name: isworking
    runtime: node
    plan: free
    # Fráncfort: la región más cercana a España y la misma que Neon y Atlas
    region: frankfurt
    branch: deploy
    buildCommand: >-
      npm ci --include=dev --prefix frontend &&
      npm run build --prefix frontend &&
      npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
