# Blueprint de Render para IsWorking.
# Un único servicio web: Express sirve la API (/api) y el frontend compilado (frontend/dist).
# MongoDB no lo ofrece Render: se usa MongoDB Atlas y su URI se introduce a mano (MONGO_URI).

services:
  - type: web
    name: isworking
    runtime: node
    plan: free
    branch: deploy
    buildCommand: >-
      npm ci --include=dev --prefix frontend &&
      npm run build --prefix frontend &&
      npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isworking-db
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

databases:
  - name: isworking-db
    plan: free
    databaseName: isworking
    user: isworking
